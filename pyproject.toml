[project]
name = "papersum"
version = "0.1.0"
description = "Section-wise summarizer for research papers (PDF / Markdown / EPUB)"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24", "ebooklib>=0.18", "beautifulsoup4>=4.12", "requests>=2.31",
  "matplotlib>=3.8", "numpy>=1.26", "ipython>=8", "ddgs>=9.0",
]

[project.optional-dependencies]
notebook = ["ipywidgets>=8.1", "ipykernel>=6.29", "jupyterlab>=4.1"]

[project.scripts]
papersum = "papersum.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
